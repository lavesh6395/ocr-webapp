
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notebook-to-PDF AI</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<nav class="navbar">

<div class="logo">Notebook-to-PDF AI</div>

<div class="version">v{{ version }}</div>

</nav>

<main class="hero">

<div class="hero-content">

<h1>Turn Handwritten Notes into Searchable PDFs</h1>

<p>

Upload notebook pages, scanned documents, or printed papers.

AI-powered OCR will soon extract editable text while preserving formatting.

</p>

<div class="upload-card">

<div id="drop-zone" class="drop-zone">

<div class="upload-icon">☁️</div>

<h3>Drag & Drop your image here</h3>

<p>PNG • JPG • JPEG</p>

<input type="file" id="file-input" accept="image/*" hidden>

<button id="browse-btn" class="secondary-btn">

Browse Files

</button>

</div>

<div id="preview-container" class="preview-container hidden">

<img id="preview-image" alt="Preview">

<p id="file-name"></p>

<button id="extract-btn" class="primary-btn">

<div id="result-container" class="result-container hidden">

<h3>Extracted Text</h3>

<pre id="ocr-result"></pre>

<button id="copy-btn" class="secondary-btn">
Copy Text
</button>

</div>  
  
  
Extract Text

</button>

</div>

</div>

</div>

</main>

</footer>

<script src="/static/script.js"></script>

</body>

</html>
